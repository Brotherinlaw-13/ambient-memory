[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-memory"
version = "0.1.0"
description = "Memory for AI agents that actually works"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Rook", email = "diegocunado@gmail.com"},
]
maintainers = [
    {name = "Rook", email = "diegocunado@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "agents", "memory", "search", "embeddings", "hybrid-search"]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4",
    "sentence-transformers>=2.0,<4",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "spacy>=3.4.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Brotherinlaw-13/ambient-memory"
Repository = "https://github.com/Brotherinlaw-13/ambient-memory"
Issues = "https://github.com/Brotherinlaw-13/ambient-memory/issues"
Documentation = "https://github.com/Brotherinlaw-13/ambient-memory/blob/main/docs/QUICKSTART.md"

[project.scripts]
ambient-memory = "ambient_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 88