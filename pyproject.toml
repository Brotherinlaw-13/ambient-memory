[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-memory"
version = "0.1.0"
description = "Open source ambient memory for AI agents. Hybrid search, topic collections, feedback loops."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Rook", email = "diegocunado@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "spacy>=3.4.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=0.950",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Brotherinlaw-13/ambient-memory"
Repository = "https://github.com/Brotherinlaw-13/ambient-memory"
Issues = "https://github.com/Brotherinlaw-13/ambient-memory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.8"
strict = true